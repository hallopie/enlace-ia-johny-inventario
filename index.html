<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfect Vision · Inventario</title>
<style>
  :root{
    --page:#f9f9f7; --surface:#fcfcfb; --field:#fff; --ink:#0b0b0b; --ink2:#52514e; --muted:#6f6d67; --grid:#e1e0d9; --axis:#c3c2b7;
    --good:#006300; --good-bg:#e5f3e8; --bad:#b42323; --bad-bg:#fbe9e7; --warn:#a06a00; --warn-bg:#fff4d6; --accent:#2a78d6; --accent-ink:#fff;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --page:#0d0d0d; --surface:#1a1a19; --field:#232322; --ink:#fff; --ink2:#c3c2b7; --muted:#a09f97; --grid:#2c2c2a; --axis:#383835;
    --good:#3ecf5a; --good-bg:#12301b; --bad:#ff7a7a; --bad-bg:#3a1717; --warn:#f3d58a; --warn-bg:#3a2f0d; --accent:#3987e5; color-scheme:dark}}
  :root{--ok:var(--good);--error:var(--bad);--tenue:var(--ink2)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{max-width:640px;margin:0 auto;padding:20px 16px 8px}
  header h1{font:700 22px/1.2 system-ui,sans-serif;margin:0;letter-spacing:-.01em}
  header small{color:var(--ink2);font-size:14px}
  .wrap{max-width:640px;margin:0 auto;padding:8px 16px 16px}
  label{display:block;margin:14px 0 6px;color:var(--ink2);font-size:13px;font-weight:600}
  input,select,textarea{width:100%;padding:11px 12px;background:var(--field);color:var(--ink);border:1px solid var(--axis);border-radius:10px;font:inherit;font-size:16px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
  input[readonly]{background:transparent;color:var(--ink2)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .ayuda,.hint{color:var(--muted);font-size:13px;line-height:1.5;margin:6px 0 0}
  .card,.hoja{background:var(--surface);border:1px solid var(--grid);border-radius:10px;padding:2px 14px 16px;margin-bottom:12px}
  .hoja-t{font:700 12px/1 system-ui;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin:14px 0 2px;padding-bottom:8px;border-bottom:1px solid var(--grid)}
  button.main{width:100%;margin-top:16px;padding:14px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;font:inherit;font-weight:600;font-size:16px;cursor:pointer}
  button.main:disabled{opacity:.5}
  button.main.sec{background:transparent;color:var(--accent);border:1px solid var(--accent);margin-top:10px}
  .msg{margin-top:14px;padding:12px 14px;border-radius:10px;display:none;line-height:1.5;font-size:15px}
  .msg.ok{display:block;background:var(--good-bg);color:var(--ink)}
  .msg.err{display:block;background:var(--bad-bg);color:var(--ink)}
  .msg b{color:var(--accent)}
  .big{font:700 34px/1.2 system-ui;color:var(--accent);font-variant-numeric:tabular-nums}
  .foto{margin-top:4px;border:1.5px dashed var(--axis);border-radius:10px;background:var(--field);padding:24px 16px;text-align:center;cursor:pointer;color:var(--ink2)}
  .foto.has{border:1.5px solid var(--accent);color:var(--good)}
  .foto .ico{font-size:28px;display:block;margin-bottom:6px}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 16px}
  a{color:var(--accent)}
  .seg{display:flex;border:1px solid var(--axis);border-radius:10px;overflow:hidden;margin:14px 0 0;background:var(--surface)}
  .seg button{flex:1;padding:11px 6px;background:transparent;color:var(--ink2);border:0;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
  .seg button+button{border-left:1px solid var(--axis)}
  .seg button.on{background:var(--ink);color:var(--page);font-weight:600}
  .solo-mano{display:none}
  body.mano .solo-mano{display:block}
  body.mano .solo-foto{display:none}
  #preview{width:100%;max-height:220px;object-fit:contain;border-radius:10px;margin-top:10px;display:none;background:#000}
</style>
</head>
<body>
<header>
  <h1>Perfect Vision</h1>
  <small>Inventario · entrada de armazones · <span id="suc-label"></span></small>
</header>
<div class="wrap">
  <div class="card">
  <label>Sucursal *</label>
  <select id="sucursal">
    <option>Perfect Vision Arcos</option><option>Perfect Vision 2</option><option>Perfect Vision 3</option><option>Perfect Vision 4</option>
  </select>

  <div class="seg" id="modo">
    <button class="on" data-m="foto">📷 Con foto</button>
    <button data-m="mano">✍️ A mano</button>
  </div>

  <div class="solo-foto">
  <label>Foto del armazón *</label>
  <div class="foto" id="zona"><span class="ico">📷</span><span id="zona-txt">Toca para tomar la foto de la varilla</span></div>
  <img id="preview" alt="Vista previa del armazón">
  <input type="file" id="foto" accept="image/*" capture="environment" hidden>
  </div>

  <div class="solo-mano">
    <label>Marca</label><input id="m_marca" placeholder="Ej. Ray-Ban">
    <label>Modelo *</label><input id="m_modelo" placeholder="Ej. RB2140 o FO-118">
    <div class="row">
      <div><label>Medidas</label><input id="m_medidas" placeholder="52-18-140"></div>
      <div><label>Código</label><input id="m_codigo" placeholder="Opcional"></div>
    </div>
  </div>

  <label>Precio de venta ($) *</label><input id="precio" type="number" inputmode="decimal" min="0">
  <label>Notas</label><input id="notas" placeholder="Color, detalle…">

  </div>
  <p class="hint solo-foto">La marca, el modelo y las medidas se leen solos desde la foto.</p>
  <p class="hint solo-mano">Úsalo si la foto no se lee bien o si no hay señal para mandar la foto.</p>
  <button class="main" id="btn">Registrar armazón</button>
  <div class="msg" id="msg"></div>
</div>
<footer>Hecho por Sótano Bajo</footer>

<script>
try { const M = {'Sucursal 1':'Perfect Vision Arcos','Sucursal 2':'Perfect Vision 2','Sucursal 3':'Perfect Vision 3','Sucursal 4':'Perfect Vision 4'}; if (M[localStorage.suc]) localStorage.suc = M[localStorage.suc]; } catch(e) {}
const WEBHOOK_INGRESO = 'https://hook.us2.make.com/dr3c8ay5ampwon7k14uvmidmpv789gkh';

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const limpio = s => String(s ?? '').replace(/["\\]/g, "'").replace(/\s+/g, ' ').trim();
function show(cls, html){ const m=$('msg'); m.className='msg '+cls; m.innerHTML=html; }

try { if (localStorage.suc) $('sucursal').value = localStorage.suc; } catch(e) {}
const updSuc = () => $('suc-label').textContent = $('sucursal').value;
updSuc();
$('sucursal').onchange = () => { updSuc(); try{localStorage.suc=$('sucursal').value}catch(e){} };

$('zona').onclick = () => $('foto').click();
$('foto').onchange = () => {
  const f = $('foto').files[0]; if (!f) return;
  $('preview').src = URL.createObjectURL(f); $('preview').style.display = 'block';
  $('zona').classList.add('has'); $('zona-txt').textContent = '✓ Foto lista (toca para cambiarla)';
};

function comprimir(file){
  return new Promise((ok, bad) => {
    const img = new Image();
    img.onload = () => {
      const max = 1000; let w = img.width, h = img.height;
      if (Math.max(w,h) > max) { const k = max / Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      ok(c.toDataURL('image/jpeg', 0.75).split(',')[1]);
    };
    img.onerror = bad;
    img.src = URL.createObjectURL(file);
  });
}

let MODO = 'foto';
try { if (localStorage.modoInv === 'mano') MODO = 'mano'; } catch(e) {}
function ponModo(m){
  MODO = m; document.body.classList.toggle('mano', m === 'mano');
  document.querySelectorAll('#modo button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('msg').className = 'msg';
  try { localStorage.modoInv = m; } catch(e) {}
}
ponModo(MODO);
document.querySelectorAll('#modo button').forEach(b => b.onclick = () => ponModo(b.dataset.m));

$('btn').onclick = async () => {
  const precio = Number($('precio').value || 0);
  const f = $('foto').files[0];
  const falta = [];
  if (MODO === 'foto' && !f) falta.push('foto');
  if (MODO === 'mano' && !limpio($('m_modelo').value)) falta.push('modelo');
  if (!precio) falta.push('precio de venta');
  if (falta.length) return show('err', 'Falta: ' + falta.join(', '));

  const b = $('btn'); b.disabled = true;
  b.textContent = MODO === 'foto' ? 'Leyendo foto…' : 'Registrando…';
  if (MODO === 'foto') show('ok', 'Leyendo la foto, tarda unos segundos…');
  try {
    const payload = {sucursal: $('sucursal').value, precio, notas: limpio($('notas').value)};
    if (MODO === 'foto') {
      payload.foto = await comprimir(f);
      if (!payload.foto || payload.foto.length < 1000) { show('err', 'La foto no se pudo leer en este celular. Vuelve a tomarla o usa la opción <b>A mano</b>.'); return; }
    }
    else Object.assign(payload, {manual: 'si', marca: limpio($('m_marca').value), modelo: limpio($('m_modelo').value),
      dimensiones: limpio($('m_medidas').value), codigo_armazon: limpio($('m_codigo').value)});
    const r = await fetch(WEBHOOK_INGRESO, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (d.success === false) throw new Error(d.mensaje || 'error');
    show('ok', `✓ Armazón registrado<br>Marca: <b>${esc(d.marca || '—')}</b><br>Modelo: <b>${esc(d.modelo || '—')}</b>` +
      (d.dimensiones ? `<br>Medidas: <b>${esc(d.dimensiones)}</b>` : ''));
    $('foto').value = ''; $('preview').style.display = 'none';
    $('zona').classList.remove('has'); $('zona-txt').textContent = 'Toca para tomar la foto de la varilla';
    ['precio','notas','m_marca','m_modelo','m_medidas','m_codigo'].forEach(i => $(i).value = '');
  } catch(e) {
    show('err', MODO === 'foto'
      ? 'No se pudo registrar con foto. Intenta de nuevo o usa la opción <b>A mano</b>.'
      : 'No se pudo registrar. Revisa la conexión e intenta de nuevo.');
  } finally { b.disabled = false; b.textContent = 'Registrar armazón'; }
};
</script>
</body>
</html>
